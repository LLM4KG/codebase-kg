[project]
name = "codebase-kg"
version = "0.1.0"
description = "Knowledge Graph extraction pipeline for React.js codebases"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "litellm>=1.56.0",
    "instructor>=1.7.0",
    "neo4j>=5.27.0",
    "tenacity>=9.0.0",
    "jinja2>=3.1.4",
    "diskcache>=5.6.3",
    "pyyaml>=6.0",
    "tomli>=2.2.0; python_version < '3.11'",
]

[project.scripts]
pipeline = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: requires a local Docker daemon and pre-built pilot harness images",
    "memgraph: requires a running Memgraph loaded with pilot KG dumps",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "vcrpy>=6.0.0",
]
